[project]
name = "supportops-deerflow-extension"
version = "0.1.0"
description = "Read-only SupportOps order lookup tool for DeerFlow"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["deerflow-extension-api>=0.2.9,<0.3"]

[project.entry-points."deerflow.extensions"]
supportops = "supportops_extension:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supportops_extension"]

[tool.ruff]
line-length = 120
target-version = "py312"
